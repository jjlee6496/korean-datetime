[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "korean-datetime"
version = "1.0.0"
description = "Korean temporal expression parser: 한국어 자연어 날짜·시간·기간 표현(다음주 월요일 저녁 7시, 추석 연휴, 3시부터 5시까지)을 datetime 구간으로 변환. 의존성 없음"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
keywords = [
    "korean", "hangul", "nlp", "korean-nlp", "datetime", "date-parser", "time-parser", "dateparser",
    "natural-language-date", "temporal-expression", "timex", "relative-date", "date-extraction",
    "한국어", "날짜", "시간", "자연어",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Korean",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/jjlee6496/korean-datetime"
Documentation = "https://github.com/jjlee6496/korean-datetime/blob/main/docs/tutorial.md"
Benchmark = "https://github.com/jjlee6496/korean-datetime/blob/main/docs/benchmark.md"
Issues = "https://github.com/jjlee6496/korean-datetime/issues"

[project.scripts]
korean-datetime = "korean_datetime.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/korean_datetime"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules -m 'not slow'"
markers = ["slow: 전체 기준 시각 스윕 (uv run pytest -m slow)"]

[tool.coverage.run]
source = ["korean_datetime"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # 한글/전각 문자 허용

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "scripts"]
