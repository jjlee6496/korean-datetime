name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.22'
      - run: uv sync --locked --python '${{ matrix.python }}'
      - run: uv run python scripts/check.py

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install wheel in an isolated environment
        run: |
          python -m venv /tmp/package-smoke
          /tmp/package-smoke/bin/pip install dist/*.whl
          cd /tmp
          /tmp/package-smoke/bin/python -c 'from datetime import datetime; from korean_datetime import parse; assert parse("내일", now=datetime(2026, 10, 1)).start == datetime(2026, 10, 2); assert parse("추석", now=datetime(2026, 1, 1)) is not None'
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/*
          if-no-files-found: error
